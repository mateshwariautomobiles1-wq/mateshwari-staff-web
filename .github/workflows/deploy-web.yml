# Mateshwari-Web.zip upload hote hi website GitHub Pages par update ho jayegi.
name: Deploy Web
on:
  push:
    branches: [ main ]
    paths: [ '*.zip' ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Unzip web app
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -q -o "$ZIP" -d tmp
          IDX=$(find tmp -name index.html | head -1)
          mkdir site
          cp -r "$(dirname "$IDX")"/. site/
          touch site/.nojekyll
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
